[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thoth-rnd-agent"
version = "0.1.0"
description = "AI-native R&D program agent reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "THOTH" }]
dependencies = [
  "alembic>=1.14,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "openai>=1.60,<3",
  "openpyxl>=3.1,<4",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
structured-pdf = ["docling==2.127.0"]
dev = [
  "basedpyright>=1.26,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
connectors = [
    "boto3>=1.40,<2",
    "mcp>=1.28,<3",
    "psycopg[binary]>=3.2,<4",
]
managed = [
    "e2b>=1.10,<3",
]
browser = [
    "playwright>=1.55,<2",
]

[project.scripts]
thoth = "thoth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "apps", "tests"]
exclude = ["apps/web", ".venv"]
reportMissingTypeStubs = "none"

[dependency-groups]
dev = [
    "reportlab>=4.2,<5",
]
