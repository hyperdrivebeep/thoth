profile_id: profile:local-codex-v1
deployment: LOCAL
bind_host: 127.0.0.1
model_route: CODEX_OAUTH
egress_policy: MODEL_ONLY
allowed_egress_hosts: []
connector_allowlist:
  - local-file-upload
  - bounded-workspace-inbox
  - read-only-git-snapshot
data_residency: Local canonical ledger; selected model context may be sent through the official Codex OAuth broker.
model_data_may_leave_boundary: true
external_writes_enabled: false
physical_actions_enabled: false
adapter_available: true
sandbox_route: DOCKER_POC
sandbox_adapter_available: true
sandbox_network_policy: DENY_ALL
notes:
  - Default hackathon and single-user reference profile.
  - Do not use for classified, export-controlled or organization-restricted data.
  - Docker adapter code is available but daemon health is checked separately; POC only.
